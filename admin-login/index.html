<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sarakat Agency - Admin Login</title>

<link rel="icon"
href="https://raw.githubusercontent.com/yourdocuments/sarakatagency.github.io/main/logo.png">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:
    linear-gradient(135deg,#111827,#263b73);
}

.login-box{
    width:92%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:22px;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

.logo{
    display:block;
    width:180px;
    max-width:100%;
    margin:0 auto 25px;
}

h1{
    text-align:center;
    margin:0 0 8px;
    color:#111827;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d8dee8;
    border-radius:10px;
    margin-bottom:18px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#263b73;
}

.demo{
    margin-top:20px;
    padding:14px;
    background:#f1f5f9;
    border-radius:10px;
    text-align:center;
    font-size:14px;
    color:#475569;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#2563eb;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="login-box">

    <img
    class="logo"
    src="https://raw.githubusercontent.com/yourdocuments/sarakatagency.github.io/main/logo.png"
    alt="Sarakat Agency">

    <h1>Admin Login</h1>

    <div class="subtitle">
        Sarakat Agency Dashboard
    </div>

    <form onsubmit="loginAdmin(event)">

        <label>Username</label>

        <input
        type="text"
        id="username"
        placeholder="Enter username"
        required>

        <label>Password</label>

        <input
        type="password"
        id="password"
        placeholder="Enter password"
        required>

        <button
        type="submit"
        class="login-btn">
            Login to Dashboard
        </button>

    </form>

    <div class="demo">

        <strong>Demo Login</strong><br><br>

        Username: <b>admin</b><br>

        Password: <b>Sarakat@123</b>

    </div>

    <a
    class="back"
    href="index.html">
        ← Back to Website
    </a>

</div>

<script>

function loginAdmin(event){

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    if(
        username === "admin" &&
        password === "Sarakat@123"
    ){

        sessionStorage.setItem(
            "sarakatAdminLoggedIn",
            "true"
        );

        window.location.href="admin.html";

    }else{

        alert(
            "Invalid username or password!"
        );

    }

}

</script>

</body>
</html>
